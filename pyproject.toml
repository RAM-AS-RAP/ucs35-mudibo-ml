[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrisence"
version = "0.1.0"
description = "Market-level Kenyan crop price forecasting"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agrisence = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
	"db: requires a real database; skipped unless --run-db is supplied",
	"models: requires saved stacking bundles and a checksum manifest",
]
