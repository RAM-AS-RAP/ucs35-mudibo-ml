# GitHub does not document exactly which events reset the 60-day scheduled-workflow timer.
# An empty commit is the most reliable method reported; check the Actions tab occasionally.
name: keepalive

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Refresh scheduled workflow activity if needed
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date -u +%s)
          age_days=$(((now - last_commit) / 86400))
          echo "Latest default-branch commit age: ${age_days} days"
          if (( age_days < 30 )); then
            echo "Recent repository activity; no keepalive commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive commit"
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            echo "::error::Could not push the keepalive commit to ${DEFAULT_BRANCH}; check branch protection and workflow permissions."
            exit 1
          fi